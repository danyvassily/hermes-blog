<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.015)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="crowd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="0.5">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Fog layers -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#fog)" opacity="0.5"/>

  <!-- Background crowd silhouettes (blurred) -->
  <g opacity="0.06" filter="url(#softGlow)">
    <ellipse cx="100" cy="580" rx="30" ry="60" fill="white"/>
    <ellipse cx="180" cy="560" rx="25" ry="55" fill="white"/>
    <ellipse cx="280" cy="590" rx="28" ry="58" fill="white"/>
    <ellipse cx="350" cy="555" rx="26" ry="56" fill="white"/>
    <ellipse cx="450" cy="575" rx="30" ry="60" fill="white"/>
    <ellipse cx="550" cy="550" rx="22" ry="52" fill="white"/>
    <ellipse cx="650" cy="585" rx="27" ry="57" fill="white"/>
    <ellipse cx="750" cy="560" rx="25" ry="55" fill="white"/>
    <ellipse cx="850" cy="590" rx="29" ry="59" fill="white"/>
    <ellipse cx="950" cy="555" rx="24" ry="54" fill="white"/>
    <ellipse cx="1050" cy="580" rx="28" ry="58" fill="white"/>
    <ellipse cx="1150" cy="565" rx="26" ry="56" fill="white"/>
  </g>

  <!-- Foreground solitary figure -->
  <g transform="translate(600, 420)">
    <!-- Shadow at feet -->
    <ellipse cx="0" cy="180" rx="50" ry="8" fill="rgba(255,255,255,0.03)"/>

    <!-- Body - trench coat silhouette -->
    <path d="M-20,80 L-15,10 L-8,-40 L8,-40 L15,10 L20,80 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

    <!-- Head -->
    <circle cx="0" cy="-50" r="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

    <!-- Glowing inner void (the empty feeling) -->
    <circle cx="0" cy="-50" r="6" fill="rgba(255,255,255,0.03)" filter="url(#glow)"/>
  </g>

  <!-- Light rays from above (cold, distant) -->
  <g opacity="0.03">
    <polygon points="400,0 380,800 420,800" fill="white"/>
    <polygon points="600,0 570,800 630,800" fill="white"/>
    <polygon points="800,0 770,800 830,800" fill="white"/>
  </g>

  <!-- Particle / dust motes -->
  <g filter="url(#glow)">
    <circle cx="200" cy="150" r="1" fill="rgba(255,255,255,0.04)"/>
    <circle cx="450" cy="300" r="1.5" fill="rgba(255,255,255,0.03)"/>
    <circle cx="700" cy="180" r="1" fill="rgba(255,255,255,0.04)"/>
    <circle cx="900" cy="350" r="1.2" fill="rgba(255,255,255,0.03)"/>
    <circle cx="320" cy="450" r="0.8" fill="rgba(255,255,255,0.03)"/>
    <circle cx="850" cy="250" r="1" fill="rgba(255,255,255,0.02)"/>
    <circle cx="150" cy="500" r="1.3" fill="rgba(255,255,255,0.02)"/>
  </g>

  <!-- Horizontal line dividing light and dark (the threshold) -->
  <line x1="0" y1="400" x2="1200" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>

  <!-- Bottom vignette -->
  <rect x="0" y="700" width="1200" height="100" fill="url(#fog)" opacity="0.3"/>
</svg>
